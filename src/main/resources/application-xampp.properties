# XAMPP 8.2 bundles MariaDB 10.4, not Oracle MySQL 8.
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/hospital_academico?createDatabaseIfNotExist=true}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.database-platform=org.hibernate.community.dialect.MariaDBLegacyDialect
