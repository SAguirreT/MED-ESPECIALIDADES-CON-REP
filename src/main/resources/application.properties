spring.application.name=clinica-aurora
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hospital_academico?createDatabaseIfNotExist=true&serverTimezone=America/Lima}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
server.port=${PORT:8080}
server.error.include-message=never
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000
app.demo=false
app.bootstrap.email=${ADMIN_EMAIL:}
app.bootstrap.password=${ADMIN_PASSWORD:}
